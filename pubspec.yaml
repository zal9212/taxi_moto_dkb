name: moto_taxi_douka
description: "Application de gestion des versements de motos-taxis"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Base de données locale
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.3

  # Authentification biométrique / PIN
  local_auth: ^2.3.0
  flutter_secure_storage: ^9.2.2
  crypto: ^3.0.3

  # Notifications locales
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.4

  # Export PDF
  pdf: ^3.11.0
  printing: ^5.13.1

  # Utilitaires
  intl: ^0.19.0
  provider: ^6.1.2
  uuid: ^4.4.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
