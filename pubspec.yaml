name: moto_taxi_douka
description: "Application de gestion des versements de motos-taxis"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Base de données locale
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.3

  # Authentification biométrique / PIN
  local_auth: ^2.3.0
  flutter_secure_storage: ^9.2.2
  crypto: ^3.0.3

  # Notifications locales
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.4

  # Export PDF
  pdf: ^3.11.0
  printing: ^5.13.1

  # Utilitaires
  intl: ^0.19.0
  provider: ^6.1.2
  uuid: ^4.4.2

  # Graphiques (statistiques des versements)
  fl_chart: ^0.69.0

  # Ecran de demarrage (utilise a l'execution pour controler sa duree
  # minimale via FlutterNativeSplash.preserve()/remove())
  flutter_native_splash: ^2.4.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/icon/logo_app.png
    - assets/icon/splash_app.png
    - assets/icon/splash_icon_android12.png
    - assets/icon/splash_branding.png

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icon/logo_app.png"
  min_sdk_android: 21
  windows:
    generate: true
  macos:
    generate: true

flutter_native_splash:
  color: "#090808"
  image: assets/icon/splash_app.png
  android_12:
    color: "#090808"
    # Sur Android 12+, l'image est systematiquement decoupee dans un
    # cercle par l'OS (contrainte de la SplashScreen API, non
    # contournable) : on y met donc uniquement l'icone (deja circulaire)
    # et le texte "MOTO TAXI DOUKA" passe par le "branding", affiche
    # sous forme de rectangle non decoupe en bas de l'ecran.
    image: assets/icon/splash_icon_android12.png
    branding: assets/icon/splash_branding.png
  android: true
  ios: true
  web: false
