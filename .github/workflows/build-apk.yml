name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: stable

      - run: flutter pub get

      # Reconstitue la cle de signature stable a partir des secrets du repo
      # (KEYSTORE_BASE64, KEY_ALIAS, KEY_PASSWORD, STORE_PASSWORD), si
      # configures. Sans ca, chaque run CI signe avec une cle debug generee
      # au hasard sur cette machine ephemere : Android refuse alors chaque
      # mise a jour comme un paquet different, forcant a desinstaller
      # l'ancienne version (donc a perdre les donnees). Voir android/app/
      # build.gradle.kts pour la logique de repli si ces secrets sont absents.
      - name: Configurer la signature release
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

      # --build-number ecrase le numero apres le "+" de pubspec.yaml (versionCode
      # Android) par le numero de run GitHub Actions, qui augmente tout seul a
      # chaque build : plus besoin d'y penser ni de modifier pubspec.yaml avant
      # de pousser. Le nom de version (1.0.1, avant le "+") reste, lui, celui de
      # pubspec.yaml — a changer a la main seulement quand tu veux marquer une
      # vraie nouvelle version.
      - run: flutter build apk --release --build-number=${{ github.run_number }}

      - uses: actions/upload-artifact@v6
        with:
          name: moto-taxi-douka-apk
          path: build/app/outputs/flutter-apk/app-release.apk
